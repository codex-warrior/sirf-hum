name: sirf_hum
description: "Sirf Hum — the private digital home for two people."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.3

# Every dependency needs a reason; record significant ones in
# docs/decisions/DECISION-LOG.md.
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  firebase_app_check: ^0.5.0
  firebase_crashlytics: ^6.0.0
  # Device registry (Prompt 07, D-069): the pending record in Firestore and
  # the challenge/activation callables. Imported only by lib/infrastructure.
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  # Encrypted media objects (Prompt 11, D-095): ciphertext uploads and
  # downloads only. Imported only by lib/infrastructure.
  firebase_storage: ^14.0.0
  # Content-free push wake-ups (Prompt 11, D-097, D-098): the device's FCM
  # token and incoming signals. Imported only by lib/infrastructure.
  firebase_messaging: ^17.0.0
  # Crypto core (Rust + OpenMLS 0.9.1, D-063). Builds via its native-assets
  # hook, so Android/iOS builds need the Rust toolchain (rustup).
  sirf_hum_crypto:
    path: packages/sirf_hum_crypto
  # Account session (Prompt 13, D-107) and sign-in (email link D-148,
  # Google D-150): observes, restores and signs in the account, and signs
  # out. Imported only by lib/infrastructure.
  firebase_auth: ^7.0.0
  # Google sign-in (D-150): Android Credential Manager returns a Google ID
  # token that is exchanged once with Firebase Auth (signInWithCredential).
  # Identity only, never device trust. Pinned like the other security-path
  # plugins; imported only by lib/infrastructure.
  google_sign_in: 7.2.0
  # Moments (Prompt 15, D-117): the system photo picker (Android Photo
  # Picker, no storage permission). Its temporary copies are deleted after
  # encryption. Imported only by features/moments/data.
  image_picker: ^1.2.4
  # SHA-256 for the commit-authorization binding (Prompt 17B, D-127) and the
  # partner safety number (D-128). dart-lang/crypto, already in the lockfile
  # as a transitive dependency; a hash function only, no new primitive.
  crypto: ^3.0.6
  qr: 4.0.0
  mobile_scanner: 7.4.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Brand typeface (D-156). Bundled, never fetched at runtime: no font
  # request leaves the phone. Licence: assets/fonts/OFL.txt (shown in the
  # app's licences page).
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
