name: Staging beta build

# Manual. Builds a sideloadable STAGING release APK for the two-device beta
# (docs/STAGING-BETA.md §6, D-146). Never deploys, never uploads to Google
# Play, holds no deploy credentials, and cannot build any other flavor.
#
# The client config (public identifiers, not secrets) comes from the
# `staging` GitHub Environment secret SH_ENV_CONFIG_JSON and must pass
# tool/check_env_config.mjs before anything is built. The APK is
# debug-signed (no staging signing key exists): fine for sideloading onto
# test devices, not distributable. Artifacts on this public repository are
# visible to signed-in GitHub users, so retention is short.
# Supply chain (D-124): actions pinned to full commit SHAs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5
  APK: build/app/outputs/flutter-apk/app-staging-release.apk

jobs:
  build:
    name: Staging release APK (com.sirfhum.app.staging)
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Same pinned NDK and Rust toolchain as ci.yml (see the comments there).
      - name: Install pinned Android NDK
        run: |
          for attempt in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null \
              && test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" && exit 0
            echo "NDK install attempt $attempt failed; retrying"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
          done
          exit 1
      - name: Install pinned Rust toolchain
        working-directory: packages/sirf_hum_crypto/native
        run: |
          rustup toolchain install || true
          rustc --version | grep -q '^rustc 1\.96\.0 ' || { echo "::error::rustc is not the pinned 1.96.0"; exit 1; }
      - name: Write and check the staging config
        env:
          SH_ENV_CONFIG_JSON: ${{ secrets.SH_ENV_CONFIG_JSON }}
        run: |
          [[ -n "$SH_ENV_CONFIG_JSON" ]] || { echo "::error::staging secret SH_ENV_CONFIG_JSON is not set"; exit 1; }
          printf '%s' "$SH_ENV_CONFIG_JSON" > config/env/staging.json
          node tool/check_env_config.mjs staging config/env/staging.json
      - name: Build
        run: >-
          flutter build apk --release
          --flavor staging
          --dart-define-from-file=config/env/staging.json
      - name: Gradle lockfile unchanged by the build
        run: git diff --exit-code -- android/app/gradle.lockfile
      - name: Verify application ID
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          "$aapt2" dump badging "$APK" | grep -q "package: name='com.sirfhum.app.staging'" \
            || { echo "::error::$APK is not com.sirfhum.app.staging"; exit 1; }
      - name: Verify crypto core is bundled for every ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libsirf_hum_crypto.so" || { echo "::error::libsirf_hum_crypto.so missing for $abi"; exit 1; }
          done
      # The compiled Dart code carries the dart-defines. It must hold the
      # staging Android app ID and no app ID of another project (project
      # numbers: tool/check_env_config.mjs).
      - name: Verify only staging Firebase config is embedded
        run: |
          so="$(mktemp)"
          unzip -p "$APK" lib/arm64-v8a/libapp.so > "$so"
          grep -aq '1:203770631547:android:' "$so" || { echo "::error::staging Android app ID not embedded"; exit 1; }
          for number in 244475624083 627383930881; do
            if grep -aq "1:$number:" "$so"; then echo "::error::another environment's app ID is embedded"; exit 1; fi
          done
          sha256sum "$APK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sirf-hum-staging-apk
          path: ${{ env.APK }}
          retention-days: 7
          if-no-files-found: error
