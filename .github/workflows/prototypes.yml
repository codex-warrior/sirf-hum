name: Prototypes

# Experimental spikes only (prototypes/**). Never part of the app build (D-052).
# Prompt 05 MLS decision gate: same scenarios against OpenMLS and mls-rs,
# interop, wasm32, Dart FFI, Android packaging, upstream test vectors.

# Also re-run when the app's crypto core changes: the decision-gate suite is the
# library-switch safety net and regression baseline for it (D-062).
on:
  push:
    branches: [main]
    paths: ['prototypes/**', 'packages/sirf_hum_crypto/native/**', '.github/workflows/prototypes.yml']
  pull_request:
    paths: ['prototypes/**', 'packages/sirf_hum_crypto/native/**', '.github/workflows/prototypes.yml']

permissions:
  contents: read

concurrency:
  group: prototypes-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.96.0
  WASM_BINDGEN: 0.2.129
  NDK_VERSION: 28.2.13676358
  CARGO_TERM_COLOR: never

defaults:
  run:
    working-directory: prototypes/mls-decision-gate

jobs:
  native:
    name: Scenarios + interop + benchmarks (native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (= v1) at pin time
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Runner
        run: |
          echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) x$(nproc)"
          rustc --version
      - name: Scenario + interop tests (both backends)
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast -- --nocapture --test-threads=1 2>&1 | tee test.log | grep -E "^test |test result|OBSERVATION|INTEROP|panicked|^error"
      - name: FFI crate with the mls-rs backend
        run: cargo test --locked -p sh-crypto-ffi-spike --no-default-features --features mlsrs
      - name: Benchmarks (release)
        if: always()
        run: |
          cargo run --locked --release -q -p backend-openmls --example bench
          cargo run --locked --release -q -p backend-mlsrs --example bench

  wasm:
    name: Scenarios on wasm32 (Node) + wasm size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (= v1) at pin time
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen test runner (matches Cargo.lock)
        run: cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN"
      - name: Scenarios on wasm32
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --target wasm32-unknown-unknown -p backend-openmls -p backend-mlsrs --tests
      - name: Release wasm size per backend
        run: |
          for b in openmls mlsrs; do
            cargo build --locked --release --target wasm32-unknown-unknown -p sh-crypto-ffi-spike --no-default-features --features $b
            echo "WASM_SIZE $b $(stat -c %s target/wasm32-unknown-unknown/release/sh_crypto_ffi_spike.wasm) bytes"
          done

  dart-ffi:
    name: Dart FFI → Rust (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [openmls, mlsrs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (= v1) at pin time
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.11.3
      - run: cargo build --locked --release -p sh-crypto-ffi-spike --no-default-features --features ${{ matrix.backend }}
      - name: dart test through FFI
        working-directory: prototypes/mls-decision-gate/ffi/dart
        env:
          SH_FFI_LIB: ${{ github.workspace }}/prototypes/mls-decision-gate/target/release/libsh_crypto_ffi_spike.so
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded

  android:
    name: Android packaging (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [openmls, mlsrs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (= v1) at pin time
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install the NDK the app already pins (D-040)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"
      - name: Build .so for each Flutter Android ABI (API 24)
        run: |
          set -euo pipefail
          for pair in aarch64-linux-android:aarch64-linux-android24 armv7-linux-androideabi:armv7a-linux-androideabi24 x86_64-linux-android:x86_64-linux-android24; do
            target="${pair%%:*}"; clang="${pair##*:}"
            upper="$(echo "$target" | tr 'a-z-' 'A-Z_')"
            export "CARGO_TARGET_${upper}_LINKER=$NDK/bin/${clang}-clang"
            export "CC_${target//-/_}=$NDK/bin/${clang}-clang"
            export "AR_${target//-/_}=$NDK/bin/llvm-ar"
            cargo build --locked --release --target "$target" -p sh-crypto-ffi-spike --no-default-features --features ${{ matrix.backend }}
            so="target/$target/release/libsh_crypto_ffi_spike.so"
            "$NDK/bin/llvm-strip" "$so"
            echo "ANDROID_SIZE ${{ matrix.backend }} $target $(stat -c %s "$so") bytes (stripped)"
            "$NDK/bin/llvm-readelf" -h "$so" | grep -E "Machine|Class"
          done

  # iOS packaging removed (D-092): iOS is not a current product platform.
  # The Dart FFI path is covered on Linux by the `dart-ffi` jobs.

  upstream-kats:
    name: Upstream test vectors (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: openmls v0.9.1, repo: openmls/openmls, ref: v0.9.1, cmd: 'cargo test -p openmls --release' }
          - { name: mls-rs 0.56.0, repo: awslabs/mls-rs, ref: 0.56.0, cmd: 'cargo test -p mls-rs --release' }
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: upstream
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (= v1) at pin time
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Record the exact upstream commit
        run: git rev-parse HEAD
      # OpenMLS's workspace includes a `cli` demo that depends on termion from
      # gitlab.redox-os.org; that git host became unreachable on 2026-10-18 and
      # Cargo resolves every workspace member even for `-p openmls`. The cli is
      # not part of the library, its tests or the IETF vectors, so drop just
      # that member. Fails loudly if the edit does not apply.
      - name: Drop the unrelated OpenMLS cli workspace member
        if: matrix.repo == 'openmls/openmls'
        run: |
          grep -qx '    "cli",' Cargo.toml
          sed -i '/^    "cli",$/d' Cargo.toml
          ! grep -q '"cli"' Cargo.toml
          echo "workspace members now:"; sed -n '/members/,/\]/p' Cargo.toml
      - name: Run the pinned release's own test suite (includes IETF MLS test vectors)
        run: |
          set +e
          ${{ matrix.cmd }} > ../kat.log 2>&1
          rc=$?
          set -e
          grep -E "test result|FAILED|panicked" ../kat.log || true
          echo "--- tests touching test vectors:"
          grep -E "^test .*(kat|test_vector|interop|tree_math|key_schedule|secret_tree|treekem|transcript|passive|welcome|message_protection|crypto_basics|psk|serialization|deserialization).* \.\.\. " ../kat.log | sort | uniq -c | sort -rn | head -60 || true
          grep -cE "^test .* \.\.\. ok$" ../kat.log | sed 's/^/TOTAL_OK /'
          echo "cargo exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            # Show why it failed instead of only "exit 101" (e.g. a build
            # error from upstream dependency drift).
            if [ -f Cargo.lock ]; then echo "upstream Cargo.lock: present"; else echo "upstream Cargo.lock: absent (dependencies resolve fresh)"; fi
            echo "--- cargo errors:"
            grep -nE "^error" -A15 ../kat.log | head -200 || true
            echo "--- log tail:"
            tail -80 ../kat.log
          fi
          exit $rc
