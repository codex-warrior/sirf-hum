name: TEMP regenerate Gradle locks (remove before merge)

# One-off for PR #24 (D-142: locks are regenerated on Linux). Reads only;
# uploads the regenerated android/app/gradle.lockfile as an artifact.
on:
  pull_request:

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
      - run: flutter pub get && flutter build apk --config-only --flavor production
      - working-directory: android
        run: ./gradlew :app:dependencies --write-locks -q > /dev/null
      - run: git diff --stat -- android/app/gradle.lockfile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-lockfile
          path: android/app/gradle.lockfile
          retention-days: 1
