name: Deploy

# Manual, environment-explicit Firebase deploys. Nothing deploys on push.
#
# Each run binds to a GitHub Environment of the same name, whose secrets and
# protection rules apply:
#   development - any maintainer
#   staging     - any maintainer
#   production  - required reviewers + deployment branch restricted to main
# Credentials use Workload Identity Federation (no service-account keys).
# Setup: docs/architecture/ENVIRONMENTS.md ("CI secrets").

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [development, staging, production]
      targets:
        description: What to deploy
        required: true
        type: choice
        default: rules
        options: [rules, functions, hosting, all]

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.targets }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Production deploys only from main
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys must run from main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4

      - name: Resolve targets
        id: targets
        run: |
          case "${{ inputs.targets }}" in
            rules)     echo "only=firestore:rules,firestore:indexes,storage" >> "$GITHUB_OUTPUT" ;;
            functions) echo "only=functions" >> "$GITHUB_OUTPUT" ;;
            hosting)   echo "only=hosting:app" >> "$GITHUB_OUTPUT" ;;
            all)       echo "only=firestore:rules,firestore:indexes,storage,functions,hosting:app" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        if: contains(steps.targets.outputs.only, 'hosting')
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
      - run: npm install -g firebase-tools

      - name: Write client config for this environment
        if: contains(steps.targets.outputs.only, 'hosting')
        env:
          SH_ENV_CONFIG_JSON: ${{ secrets.SH_ENV_CONFIG_JSON }}
        run: |
          test -n "$SH_ENV_CONFIG_JSON" || { echo "::error::SH_ENV_CONFIG_JSON secret missing"; exit 1; }
          printf '%s' "$SH_ENV_CONFIG_JSON" > "config/env/${{ inputs.environment }}.json"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy
        env:
          # Reaching this step for production already required reviewer
          # approval via the protected "production" environment.
          SH_CONFIRM_PRODUCTION: ${{ inputs.environment == 'production' && 'sirf-hum-prod' || '' }}
        run: bash tool/deploy.sh "${{ inputs.environment }}" --only "${{ steps.targets.outputs.only }}"
