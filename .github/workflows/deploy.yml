name: Deploy

# Manual, environment-explicit Firebase deploys. Nothing deploys on push.
#
# Each run binds to the GitHub Environment of the same name. Production is
# guarded by (docs/architecture/ENVIRONMENTS.md, "Production deploy gates"):
#   - the environment's deployment branch policy (main only),
#   - a typed confirmation input equal to the production project ID,
#   - Workload Identity Federation conditions that only mint production
#     credentials for this repository, the production environment and main.
# Required reviewers are NOT available on the current GitHub plan.
# No service-account keys: Google auth is Workload Identity Federation.
# Supply chain (Prompt 17, D-124): every action is pinned to a full commit
# SHA (the tag is a comment) and firebase-tools to an exact version, because
# this job holds deploy credentials. Update pins deliberately, in a PR.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [development, staging, production]
      targets:
        description: What to deploy (storage needs a Storage bucket, functions need Blaze)
        required: true
        type: choice
        default: rules
        options: [rules, storage, functions, hosting]
      confirm:
        description: Production only - type sirf-hum-prod to confirm
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.targets }} to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Production gates
        if: inputs.environment == 'production'
        # Inputs reach the shell as environment variables, never as text
        # spliced into the script: `confirm` is free text (Prompt 17, D-124).
        env:
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from main."; exit 1
          fi
          if [ "$CONFIRM" != "sirf-hum-prod" ]; then
            echo "::error::Type sirf-hum-prod in the 'confirm' input to deploy to production."; exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve targets
        id: targets
        run: |
          case "${{ inputs.targets }}" in
            rules)     echo "only=firestore:rules,firestore:indexes" >> "$GITHUB_OUTPUT" ;;
            storage)   echo "only=storage" >> "$GITHUB_OUTPUT" ;;
            functions) echo "only=functions" >> "$GITHUB_OUTPUT" ;;
            hosting)   echo "only=hosting:app" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: inputs.targets == 'hosting'
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
      - run: npm install -g firebase-tools@15.34.0

      - name: Write client config for this environment
        if: inputs.targets == 'hosting'
        env:
          SH_ENV_CONFIG_JSON: ${{ secrets.SH_ENV_CONFIG_JSON }}
        run: |
          test -n "$SH_ENV_CONFIG_JSON" || { echo "::error::SH_ENV_CONFIG_JSON secret missing"; exit 1; }
          printf '%s' "$SH_ENV_CONFIG_JSON" > "config/env/${{ inputs.environment }}.json"

      # Provider and service account are identifiers, not secrets; they live in
      # environment-scoped variables so each environment gets its own identity.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy
        env:
          # Production gates above already required main + typed confirmation.
          SH_CONFIRM_PRODUCTION: ${{ inputs.environment == 'production' && inputs.confirm || '' }}
        run: bash tool/deploy.sh "${{ inputs.environment }}" --only "${{ steps.targets.outputs.only }}"
