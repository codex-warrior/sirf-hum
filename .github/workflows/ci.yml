name: CI

# Validation only. Never deploys and needs no credentials: builds use
# SH_ENV alone (Firebase "not configured"), which the environment guard allows
# outside production. See docs/architecture/ENVIRONMENTS.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5

jobs:
  flutter:
    name: Flutter (format, analyze, test, web build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The crypto core's build hook runs cargo; rust-toolchain.toml pins the
      # exact toolchain and targets. Fails closed on any other rustc.
      - name: Install pinned Rust toolchain
        working-directory: packages/sirf_hum_crypto/native
        run: |
          rustup toolchain install || true  # reads rust-toolchain.toml (rustup >= 1.28)
          rustc --version | grep -q '^rustc 1\.96\.0 ' || { echo "::error::rustc is not the pinned 1.96.0"; exit 1; }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # Device-identity tests run through the real native core here; a
      # missing native build fails instead of skipping.
      - run: flutter test
        env:
          SIRF_HUM_REQUIRE_NATIVE_CRYPTO: '1'
      - name: Web build (one per environment)
        run: |
          for env in development staging production; do
            flutter build web --release --dart-define=SH_ENV=$env --output=build/web-$env
          done

  android:
    name: Android (${{ matrix.flavor }} ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    needs: flutter
    # One flavor per job: three Gradle builds plus the NDK in a single job
    # exhausted the runner's disk on the second CI run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: development, mode: debug, app_id: com.sirfhum.app.dev }
          - { flavor: staging, mode: debug, app_id: com.sirfhum.app.staging }
          # Release compile (R8) for the production identity; debug-signed
          # fallback because CI holds no signing key.
          - { flavor: production, mode: release, app_id: com.sirfhum.app }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Flutter 3.41.5 pins NDK 28.2.13676358 (FlutterExtension.ndkVersion),
      # which the runner image lacks. Install it explicitly (with retries)
      # instead of letting Gradle auto-install it mid-configuration, which
      # failed on the first CI run with a corrupt download.
      - name: Install pinned Android NDK
        run: |
          for attempt in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null \
              && test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" && exit 0
            echo "NDK install attempt $attempt failed; retrying"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
          done
          exit 1
      # The crypto core's build hook runs cargo; rust-toolchain.toml pins the
      # exact toolchain and targets. Fails closed on any other rustc.
      - name: Install pinned Rust toolchain
        working-directory: packages/sirf_hum_crypto/native
        run: |
          rustup toolchain install || true  # reads rust-toolchain.toml (rustup >= 1.28)
          rustc --version | grep -q '^rustc 1\.96\.0 ' || { echo "::error::rustc is not the pinned 1.96.0"; exit 1; }
      - name: Build
        env:
          # CI holds no signing key: an explicit, non-distributable
          # verification build (D-143). Without this the production release
          # build refuses to fall back to debug signing.
          SH_ALLOW_DEBUG_SIGNED_RELEASE: '1'
        run: >-
          flutter build apk --${{ matrix.mode }}
          --flavor ${{ matrix.flavor }}
          --dart-define=SH_ENV=${{ matrix.flavor }}
      # The release runtime classpaths resolve against android/app/
      # gradle.lockfile (STRICT, D-142); the build must not have changed it.
      - name: Gradle lockfile unchanged by the build
        run: git diff --exit-code -- android/app/gradle.lockfile
      - name: A production release is never silently debug-signed (D-143)
        if: matrix.flavor == 'production'
        working-directory: android
        run: |
          if ./gradlew -q -m assembleProductionRelease > guard.log 2>&1; then
            echo "::error::a production release without a signing key was accepted"; exit 1
          fi
          grep -q 'Production release builds need release signing' guard.log \
            || { cat guard.log; echo "::error::failed for another reason"; exit 1; }
      - name: Verify application ID
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          apk="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-${{ matrix.mode }}.apk"
          "$aapt2" dump badging "$apk" | grep -q "package: name='${{ matrix.app_id }}'" \
            || { echo "::error::$apk is not ${{ matrix.app_id }}"; exit 1; }
      - name: Verify crypto core is bundled for every ABI
        run: |
          apk="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-${{ matrix.mode }}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libsirf_hum_crypto.so" || { echo "::error::libsirf_hum_crypto.so missing for $abi"; exit 1; }
          done

  # iOS jobs removed (D-092): iOS is not a current product platform. The
  # shared Rust/Dart/security checks above and below run on Linux/Android.

  crypto-core:
    name: Crypto core (policy, fmt, clippy, tests, audit; Dart package)
    runs-on: ubuntu-24.04
    env:
      # 0.22.x parses CVSS 4.0 advisories; 0.21.2 failed on RUSTSEC-2026-0124
      # (a database parse error, not a finding). Exact version, --locked.
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The crypto core's build hook runs cargo; rust-toolchain.toml pins the
      # exact toolchain and targets. Fails closed on any other rustc.
      - name: Install pinned Rust toolchain
        working-directory: packages/sirf_hum_crypto/native
        run: |
          rustup toolchain install || true  # reads rust-toolchain.toml (rustup >= 1.28)
          rustc --version | grep -q '^rustc 1\.96\.0 ' || { echo "::error::rustc is not the pinned 1.96.0"; exit 1; }
      # Flutter first: the policy check compares the hooks/code_assets pins
      # with the installed SDK's flutter_tools (D-067).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Hook pin check tests (D-067)
        run: bash tool/test_check_flutter_hook_pins.sh
      - name: Dependency policy (Flutter hook pins, crate pins, OpenMLS version, lockfile, features, no logging)
        run: bash tool/check_crypto_core.sh
      - name: Rust fmt, clippy, tests
        working-directory: packages/sirf_hum_crypto/native
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Lockfile unchanged by the build
        run: git diff --exit-code -- packages/sirf_hum_crypto/native/Cargo.lock
      # RustSec advisories: known, published issues in locked dependencies
      # only. It cannot find unknown bugs. Warnings (unmaintained, unsound,
      # yanked) fail too. The script re-verifies, on every run, why each of
      # its three documented ignores is inapplicable (D-068).
      - name: Known-vulnerability audit (cargo-audit)
        run: |
          cargo +stable install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          bash tool/crypto_audit.sh
      - name: Dart package (analyze, tests through the real native library)
        working-directory: packages/sirf_hum_crypto
        env:
          SIRF_HUM_REQUIRE_NATIVE_CRYPTO: '1'
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test

  crypto-android-device:
    name: Crypto core, device identity + core UX on Android emulator (integration)
    runs-on: ubuntu-24.04
    needs: crypto-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install pinned Android NDK
        run: |
          for attempt in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null && test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" && exit 0
            echo "NDK install attempt $attempt failed; retrying"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
          done
          exit 1
      # The crypto core's build hook runs cargo; rust-toolchain.toml pins the
      # exact toolchain and targets. Fails closed on any other rustc.
      - name: Install pinned Rust toolchain
        working-directory: packages/sirf_hum_crypto/native
        run: |
          rustup toolchain install || true  # reads rust-toolchain.toml (rustup >= 1.28)
          rustc --version | grep -q '^rustc 1\.96\.0 ' || { echo "::error::rustc is not the pinned 1.96.0"; exit 1; }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Run crypto integration test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            flutter test integration_test/crypto_core_test.dart integration_test/device_identity_test.dart integration_test/messaging_test.dart integration_test/media_test.dart integration_test/app_smoke_test.dart integration_test/core_ux_test.dart integration_test/together_test.dart integration_test/moments_test.dart integration_test/future_us_test.dart
            --flavor development --dart-define=SH_ENV=development -d emulator-5554

  functions:
    name: Cloud Functions (typecheck, lint, build, test, emulator)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # Known-vulnerability gate for what the server actually runs (Prompt
      # 17, D-124): production dependencies only, any severity. Like
      # tool/crypto_audit.sh it knows only published advisories; a finding
      # is assessed and fixed, never silenced by dropping this step.
      - name: Known-vulnerability audit (npm, production dependencies)
        run: npm audit --omit=dev --audit-level=low
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Device registration (challenge, proof of possession, replay and
      # cloning defences) against the Firestore emulator.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools@15.34.0
      - run: npm run test:emulator

  security-rules:
    name: Security Rules (emulator tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools@15.34.0
      - run: npm test
      # Firebase deploy and Hosting policy (Prompt 18): production deploys
      # only through the Deploy workflow and only behind the launch gate
      # (D-137); the web origin's security headers (D-140).
      - name: Production deploy gates (tool/test_deploy_guard.sh)
        working-directory: .
        run: bash tool/test_deploy_guard.sh
      - name: Web header policy
        working-directory: .
        run: node tool/check_web_headers.mjs

  # Known-vulnerability gate for the Dart/Flutter dependencies (Prompt 17B,
  # D-133) and, since Prompt 18, the locked Gradle release classpaths
  # (D-142). Rust has cargo-audit with its documented ignores (D-068) and
  # Functions has npm audit (D-124). Like those gates it knows only
  # published advisories.
  dart-advisories:
    name: Dart dependency advisories (OSV-Scanner)
    runs-on: ubuntu-24.04
    env:
      OSV_SCANNER_VERSION: 2.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OSV-Scanner (checksum-verified)
        run: |
          base=https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}
          curl -sSLO "$base/osv-scanner_linux_amd64"
          curl -sSLO "$base/osv-scanner_SHA256SUMS"
          grep " osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
      - name: Scan pubspec.lock files and the Gradle lockfile
        run: |
          ./osv-scanner_linux_amd64 scan source \
            --lockfile pubspec.lock \
            --lockfile packages/sirf_hum_crypto/pubspec.lock \
            --lockfile android/app/gradle.lockfile

  secrets-scan:
    name: Secret scan (gitleaks CLI)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The MIT-licensed CLI is used directly: gitleaks-action requires a paid
      # license for organization-owned repositories.
      - name: Install gitleaks (checksum-verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
