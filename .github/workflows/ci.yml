name: CI

# Validation only. Never deploys and needs no credentials: builds use
# SH_ENV alone (Firebase "not configured"), which the environment guard allows
# outside production. See docs/architecture/ENVIRONMENTS.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5

jobs:
  flutter:
    name: Flutter (format, analyze, test, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Web build (one per environment)
        run: |
          for env in development staging production; do
            flutter build web --release --dart-define=SH_ENV=$env --output=build/web-$env
          done

  android:
    name: Android (development debug, production release)
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --debug --flavor development --dart-define=SH_ENV=development
      - run: flutter build apk --debug --flavor staging --dart-define=SH_ENV=staging
      # Release compile (R8) for the production identity; unsigned for store
      # purposes (debug-signed fallback) since CI holds no signing key.
      - run: flutter build apk --release --flavor production --dart-define=SH_ENV=production
      - name: Verify application ID per flavor
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          check() {
            "$aapt2" dump badging "build/app/outputs/flutter-apk/app-$1.apk" \
              | grep -q "package: name='$2'" \
              || { echo "::error::app-$1.apk is not $2"; exit 1; }
          }
          check development-debug com.sirfhum.app.dev
          check staging-debug com.sirfhum.app.staging
          check production-release com.sirfhum.app

  ios:
    name: iOS (all schemes compile, tests build)
    runs-on: macos-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign --flavor development --dart-define=SH_ENV=development
      - run: flutter build ios --debug --no-codesign --flavor staging --dart-define=SH_ENV=staging
      - run: flutter build ios --release --no-codesign --flavor production --dart-define=SH_ENV=production
      - name: Verify production bundle identifier
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)" = com.sirfhum.app
      - name: Build native test target (RunnerTests)
        run: |
          xcodebuild build-for-testing \
            -workspace ios/Runner.xcworkspace \
            -scheme Development \
            -configuration Debug-Development \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 20

  functions:
    name: Cloud Functions (typecheck, lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  security-rules:
    name: Security Rules (emulator tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm test

  secrets-scan:
    name: Secret scan (gitleaks CLI)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The MIT-licensed CLI is used directly: gitleaks-action requires a paid
      # license for organization-owned repositories.
      - name: Install gitleaks (checksum-verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full git history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
