name: CI

# Validation only. Never deploys and needs no credentials: builds use
# SH_ENV alone (Firebase "not configured"), which the environment guard allows
# outside production. See docs/architecture/ENVIRONMENTS.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5

jobs:
  flutter:
    name: Flutter (format, analyze, test, web build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Web build (one per environment)
        run: |
          for env in development staging production; do
            flutter build web --release --dart-define=SH_ENV=$env --output=build/web-$env
          done

  android:
    name: Android (${{ matrix.flavor }} ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    needs: flutter
    # One flavor per job: three Gradle builds plus the NDK in a single job
    # exhausted the runner's disk on the second CI run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: development, mode: debug, app_id: com.sirfhum.app.dev }
          - { flavor: staging, mode: debug, app_id: com.sirfhum.app.staging }
          # Release compile (R8) for the production identity; debug-signed
          # fallback because CI holds no signing key.
          - { flavor: production, mode: release, app_id: com.sirfhum.app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Flutter 3.41.5 pins NDK 28.2.13676358 (FlutterExtension.ndkVersion),
      # which the runner image lacks. Install it explicitly (with retries)
      # instead of letting Gradle auto-install it mid-configuration, which
      # failed on the first CI run with a corrupt download.
      - name: Install pinned Android NDK
        run: |
          for attempt in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null \
              && test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" && exit 0
            echo "NDK install attempt $attempt failed; retrying"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
          done
          exit 1
      - name: Build
        run: >-
          flutter build apk --${{ matrix.mode }}
          --flavor ${{ matrix.flavor }}
          --dart-define=SH_ENV=${{ matrix.flavor }}
      - name: Verify application ID
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          apk="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-${{ matrix.mode }}.apk"
          "$aapt2" dump badging "$apk" | grep -q "package: name='${{ matrix.app_id }}'" \
            || { echo "::error::$apk is not ${{ matrix.app_id }}"; exit 1; }

  ios:
    name: iOS (all schemes compile, tests build)
    runs-on: macos-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Each build overwrites build/ios/iphoneos/Runner.app, so the bundle ID
      # is checked right after each scheme is built.
      - name: Development scheme
        run: |
          flutter build ios --debug --no-codesign --flavor development --dart-define=SH_ENV=development
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)" = com.sirfhum.app.dev
      - name: Staging scheme
        run: |
          flutter build ios --debug --no-codesign --flavor staging --dart-define=SH_ENV=staging
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)" = com.sirfhum.app.staging
      - name: Production scheme (release)
        run: |
          flutter build ios --release --no-codesign --flavor production --dart-define=SH_ENV=production
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)" = com.sirfhum.app
      - name: Build native test target (RunnerTests)
        run: |
          # pipefail: without it, `| tail` would hide an xcodebuild failure.
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace ios/Runner.xcworkspace \
            -scheme Development \
            -configuration Debug-Development \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 20

  functions:
    name: Cloud Functions (typecheck, lint, build, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  security-rules:
    name: Security Rules (emulator tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm test

  secrets-scan:
    name: Secret scan (gitleaks CLI)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The MIT-licensed CLI is used directly: gitleaks-action requires a paid
      # license for organization-owned repositories.
      - name: Install gitleaks (checksum-verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full git history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
